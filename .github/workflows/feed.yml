name: Security Feed

on:
  # 외부 예약 서비스가 5분마다 실행 요청
  workflow_dispatch:
    inputs:
      dry_run:
        description: "텔레그램 전송 없이 로그로만 출력"
        type: boolean
        default: false
      latest:
        description: "KISA·보안뉴스 최신 글을 이 개수만큼 다시 전송 (0이면 새 글만)"
        type: string
        default: "0"
  schedule:
    # 외부 예약이 멈췄을 때를 대비한 예비 실행
    - cron: "*/10 * * * *"

concurrency:
  group: security-feed
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 이미 보낸 기록을 실행 간에 유지
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: cve-state-${{ github.run_id }}
          restore-keys: cve-state-
      - uses: actions/cache/restore@v4
        with:
          path: kisa_state.json
          key: kisa-state-${{ github.run_id }}
          restore-keys: kisa-state-

      - name: CVE·KEV
        run: python cve_alert.py --once ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          MIN_CVSS_SCORE: "9.0"
          MAX_CVE_AGE_DAYS: "30"
          # 기존 비공개 저장소에서 이미 보낸 알림이 다시 오지 않도록 첫 실행은 최근분만
          FIRST_RUN_LOOKBACK_HOURS: "1"
          KEV_FIRST_RUN_DAYS: "0"

      - name: KISA 보안공지·보안뉴스
        if: always()
        run: python kisa_watch.py --latest ${{ inputs.latest || '0' }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          FEED_FIRST_RUN_SHOW: "0"

      - uses: actions/cache/save@v4
        if: always() && !inputs.dry_run
        with:
          path: state.json
          key: cve-state-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always() && !inputs.dry_run
        with:
          path: kisa_state.json
          key: kisa-state-${{ github.run_id }}
