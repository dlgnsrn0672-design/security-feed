name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium > /dev/null
      - run: |
          cat > p.py <<'PY'
          import asyncio, re
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page(locale="ko-KR")
                  await pg.goto("https://www.ncsc.go.kr/ko/main/main.html", wait_until="load", timeout=60000); await pg.wait_for_timeout(3000)
                  await pg.wait_for_timeout(3000)
                  links = await pg.eval_on_selector_all("a", "els => els.map(e => [e.innerText.trim().replace(/\\s+/g,' '), e.getAttribute('href')||''])")
                  mores = [h for t,h in links if t == "더보기" and "PageLink" in h]
                  print("MORES:", len(mores))
                  for h in mores:
                      await pg.goto("https://www.ncsc.go.kr" + h, wait_until="load", timeout=60000); await pg.wait_for_timeout(5000)
                      body = await pg.inner_text("body")
                      i = body.find("권고"); print("== PAGE", h[-20:], "| heading:", body[max(0,i-60):i+60].replace("\n"," / ") if i>=0 else "(no 권고)")
                      rows = await pg.eval_on_selector_all("a, tr, li", "els => els.map(e => [e.tagName, e.innerText.trim().replace(/\\s+/g,' ').slice(0,100), (e.getAttribute('href')||'').slice(0,120), (e.getAttribute('onclick')||'').slice(0,100)])")
                      n = 0
                      for tag,t,hh,oc in rows:
                          if len(t) > 15 and re.search(r"20\d\d", t) and n < 12:
                              print("  ROW:", tag, t, "|", hh, "|", oc); n += 1
                  await b.close()
          asyncio.run(main())
          PY
          python p.py
