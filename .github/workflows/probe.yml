name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          curl -sSL -m 25 -A "$UA" -o main.html "https://www.ncsc.go.kr/ko/main/main.html"
          echo "=== hrefs"; grep -oE "href=\"[^\"]{3,200}\"" main.html | sort -u | grep -viE "\.(css|png|jpg|ico|svg)|javascript:void" | head -80
          echo "=== 권고 context"; grep -oE ".{0,200}보안권고.{0,200}" main.html | head -8
          echo "=== nttId context"; grep -oE ".{0,250}nttId.{0,250}" main.html | head -5
          echo "=== scripts/api"; grep -oE "(fetch|ajax|url)\s*[:(]\s*['\"][^'\"]{3,150}" main.html | head -20
          for p in $(grep -oE "src=\"[^\"]*\.js[^\"]*\"" main.html | sed 's/src="//;s/"$//' | grep -v -i jquery | head -8); do
            case $p in http*) u=$p;; /*) u="https://www.ncsc.go.kr$p";; *) u="https://www.ncsc.go.kr/ko/main/$p";; esac
            echo "=== js $u"; curl -sSL -m 20 -A "$UA" "$u" | grep -oE "['\"][^'\"]*(api|board|bbs|advice|Advice|notice)[^'\"]{0,120}['\"]" | sort -u | head -15
          done
