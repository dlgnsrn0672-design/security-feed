name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium > /dev/null
      - run: |
          cat > p.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page(locale="ko-KR")
                  await pg.goto("https://www.ncsc.go.kr/ko/main/main.html", wait_until="networkidle")
                  reqs = []
                  pg.on("request", lambda r: reqs.append(r.method + " " + r.url) if r.resource_type in ("xhr", "fetch", "document") else None)
                  await pg.get_by_text("보안권고문", exact=True).first.click()
                  await pg.wait_for_load_state("networkidle"); await pg.wait_for_timeout(3000)
                  print("URL:", pg.url); print("TITLE:", await pg.title())
                  print("REQS:", *reqs[:15], sep="\n  ")
                  body = await pg.inner_text("body")
                  i = body.find("보안권고")
                  print("BODY:", body[max(0, i-200):i+2500])
                  rows = await pg.eval_on_selector_all("table tr, .tabulator-row, ul.board li, .list li", "els => els.slice(0,15).map(e => e.innerText.replace(/\\s+/g,' ').slice(0,150) + ' || ' + (e.querySelector('a') ? (e.querySelector('a').getAttribute('href')||'') + ' ' + (e.querySelector('a').getAttribute('onclick')||'') : '') + ' ' + (e.getAttribute('onclick')||''))")
                  print("ROWS:", *rows, sep="\n  ")
                  await b.close()
          asyncio.run(main())
          PY
          python p.py
