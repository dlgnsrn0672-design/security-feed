name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright==1.48.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.48.0
      - run: python -m playwright install --with-deps chromium > /dev/null
      - run: |
          cat > p.py <<'PY'
          import asyncio, re
          from playwright.async_api import async_playwright
          B = "https://www.ncsc.go.kr"
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(); pg = await b.new_page(locale="ko-KR")
                  await pg.goto(B + "/ko/main/main.html", wait_until="load", timeout=60000); await pg.wait_for_timeout(4000)
                  links = await pg.eval_on_selector_all("a", "els => els.map(e => [e.textContent.replace(/\\s+/g,' ').trim(), e.getAttribute('href')||''])")
                  for t, h in links:
                      if re.search("지침|가이드|자료실|권고", t) and len(t) < 40:
                          print("LINK:", t, "|", h[-30:])
                  target = next((h for t, h in links if "지침" in t and "PageLink" in h and len(t) < 20), None)
                  print("TARGET:", target)
                  if target:
                      await pg.goto(B + target, wait_until="load", timeout=60000); await pg.wait_for_timeout(4000)
                      body = await pg.inner_text("body"); print("BODY:", body[:1800].replace("\n", " / "))
                      rows = await pg.eval_on_selector_all("tr, li", "els => els.map(e => e.innerText.replace(/\\s+/g,' ').trim()).filter(t => /20\\d\\d[.-]\\d\\d[.-]\\d\\d/.test(t) && t.length < 200)")
                      print("ROWS:", *rows[:12], sep="\n  ")
                  await b.close()
          asyncio.run(main())
          PY
          python p.py
