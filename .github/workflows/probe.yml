name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          B=https://www.ncsc.go.kr
          curl -sSL -m 25 -A "$UA" -c jar -b jar -o main.html "$B/ko/main/main.html"
          echo "=== quick menu"; grep -oE ".{0,300}quick3.{0,100}" main.html | head -3
          echo "=== onclick/goPage"; grep -oE "on[a-z]+=\"[^\"]{0,160}\"" main.html | sort -u | head -30
          echo "=== inline .do/.html urls"; grep -oE "['\"][^'\" ]*\.(do|json|html)[^'\" ]*['\"]" main.html | sort -u | head -40
          for f in common2025.js cmmGridTabulator.js nform.js ui.js customCrypto.js; do
            echo "=== $f"; curl -sSL -m 20 -A "$UA" "$B/ko/js/common/$f" | grep -oE "['\"][^'\" ]*\.(do|json|html)[^'\" ]*['\"]|function [A-Za-z_]+\([^)]*\)" | sort -u | head -25
          done
          for t in $(grep -oE "PageLink.html\?token=[A-Za-z0-9_-]+" main.html | sort -u); do
            echo "=== $t"; curl -sSL -m 20 -A "$UA" -c jar -b jar "$B/ko/main/$t" -o p.html -w "HTTP %{http_code} %{url_effective}\n"; grep -oE "<title>[^<]*|<h[1-3][^>]*>[^<]{0,80}" p.html | head -4
          done
