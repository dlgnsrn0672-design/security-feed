name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          cat > p.py <<'PY'
          import re, urllib.request, http.cookiejar, html
          cj = http.cookiejar.CookieJar(); op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          op.addheaders = [("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120")]
          B = "https://www.ncsc.go.kr"
          main = op.open(B + "/ko/main/main.html", timeout=30).read().decode("utf-8", "replace")
          pairs = re.findall(r'<a[^>]+href="(/ko/main/PageLink\.html\?token=[^"]+)"[^>]*>(.*?)</a>', main, re.S)
          mores = [h for h, t in pairs if "더보기" in re.sub("<[^>]+>", "", t)]
          print("mores:", len(mores))
          page = op.open(B + mores[0], timeout=30).read().decode("utf-8", "replace")
          print("len", len(page), "| has 연례보고서:", "연례보고서" in page, "| has 권고:", page.count("권고"))
          rows = re.findall(r"<tr.*?</tr>", page, re.S)
          print("rows:", len(rows))
          for r in rows[:12]:
              txt = re.sub(r"\s+", " ", html.unescape(re.sub("<[^>]+>", " ", r))).strip()
              a = re.search(r'href="([^"]+)"', r); oc = re.search(r'onclick="([^"]+)"', r)
              print("ROW:", txt[:110], "|", (a.group(1)[-50:] if a else ""), "|", (oc.group(1)[:80] if oc else ""))
          # 공지 목록이 스크립트로 오는지 확인
          print("SCRIPT hints:", re.findall(r"(?:url|action)\s*[:=]\s*['\"]([^'\"]+)", page)[:10])
          PY
          python p.py
