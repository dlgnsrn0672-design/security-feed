name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium > /dev/null
      - run: |
          cat > p.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page(locale="ko-KR")
                  await pg.goto("https://www.ncsc.go.kr/ko/main/main.html", wait_until="load", timeout=60000); await pg.wait_for_timeout(3000)
                  links = await pg.eval_on_selector_all("a", "els => els.map(e => [e.innerText.trim().replace(/\\s+/g,' '), e.getAttribute('href')||'', e.getAttribute('onclick')||'', e.offsetParent!==null])")
                  for t,h,o,v in links:
                      if any(k in t for k in ("권고","공지","자료","보안")) or "권고" in (h+o):
                          print("LINK:", v, t[:40], "|", h[:160], "|", o[:160])
                  print("URL:", pg.url)
                  await b.close()
          asyncio.run(main())
          PY
          python p.py
